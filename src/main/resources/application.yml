server:
  port: ${PORT:8086}

spring:
  application:
    name: CORPORACIONMINERADELPERU

  # Configuracion para la base de datos PostgreSQL
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cmp_db}
    username: ${DB_USERNAME:neillolazabal}
    password: ${DB_PASSWORD:neill}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 15
      minimum-idle: 5
      connection-timeout: 3000
      idle-timeout: 300000
      keepalive-time: 60000
      leak-detection-threshold: 5000
      pool-name: CMPHikariPool

  # Configuracion de JPA (Hibernate)
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

# Variables de entorno personalizadas para Seguridad JWT
app:
  security:
    jwt:
      secret: ${JWT_SECRET:586E3272357538782F413F4428472B4B6250655368566D597133743677397A24}
      expiration: ${JWT_EXPIRATION:86400000}